<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff8fb">
<title>公开排单</title>
<style>
:root{--rose:#e9789d;--rose2:#f4a7bf;--bg:#fff8fb;--panel:#fff;--soft:#fff0f5;--line:#f2dce4;--text:#45383d;--muted:#927d85;--ok:#5d9b72}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);background:var(--bg)}
.wrap{width:min(880px,100%);margin:0 auto;padding:18px 14px 44px}.brand{display:flex;align-items:center;gap:10px;margin-bottom:16px}.logo{width:42px;height:42px;border-radius:15px;display:grid;place-items:center;background:var(--soft);border:1px solid var(--line);font-size:22px}.brand b{display:block;font-size:16px}.brand small{color:var(--muted);font-size:10px}
.hero{padding:22px;border:1px solid var(--line);background:rgba(255,255,255,.9);border-radius:24px;box-shadow:0 18px 55px rgba(125,76,95,.08)}.hero h1{font-size:25px;margin:0}.hero p{color:var(--muted);font-size:12px;line-height:1.7;margin:7px 0 0}.badge{display:inline-flex;margin-top:11px;padding:5px 9px;border-radius:999px;background:var(--soft);color:var(--rose);font-size:10px;font-weight:800}
.list{display:grid;gap:10px;margin-top:14px}.item{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px}.row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.title{font-weight:850;font-size:15px}.pos{font-size:10px;color:var(--muted);margin-bottom:4px}.status{padding:5px 9px;border-radius:999px;background:var(--soft);color:var(--rose);font-size:10px;font-weight:800;white-space:nowrap}.meta{color:var(--muted);font-size:11px;line-height:1.65;margin-top:7px}.progress{height:7px;border-radius:999px;background:#f4edf0;overflow:hidden;margin-top:10px}.progress>span{display:block;height:100%;background:linear-gradient(90deg,var(--rose2),var(--rose));border-radius:999px}.empty{margin-top:14px;padding:26px;border:1px dashed var(--line);border-radius:18px;text-align:center;color:var(--muted);background:#fffbfd;font-size:12px;line-height:1.7}
.footer{text-align:center;color:var(--muted);font-size:10px;margin-top:18px}
@media(max-width:600px){.wrap{padding:12px 10px 34px}.hero{padding:17px;border-radius:20px}.hero h1{font-size:22px}.row{gap:8px}.item{padding:12px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><div class="logo" id="brandLogo"><span id="brandEmoji">🍓</span><img id="brandImage" alt="美工头像" style="display:none;width:100%;height:100%;object-fit:cover"></div><div><b id="brandTitle">公开排单</b><small>公开排单 · 无需登录</small></div></div>
  <section class="hero">
    <h1 id="artistName">正在读取排单…</h1>
    <p id="updatedText">请稍候</p>
    <span id="privacyBadge" class="badge">公开排单</span>
  </section>
  <div id="scheduleList" class="list"></div>
  <div class="footer">仅展示安全版排单信息</div>
</div>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const SUPABASE_URL="https://cwzeknrjetwbczqgmdit.supabase.co";
const SUPABASE_KEY="sb_publishable_kI3ZY_VCFSHIn1sVm1xJ1Q_b9zZAGV2";
const supabase=createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const token=new URL(location.href).searchParams.get("t")||"";
function safeColor(v,fallback){return /^#[0-9a-fA-F]{6}$/.test(String(v||""))?v:fallback}
function applyAppearance(data){
  const a=data?.appearance||{};
  const t=a.theme||{};
  document.documentElement.style.setProperty("--rose",safeColor(t.accent,"#e9789d"));
  document.documentElement.style.setProperty("--rose2",safeColor(t.accent,"#f4a7bf"));
  document.documentElement.style.setProperty("--bg",safeColor(t.bg,"#fff8fb"));
  document.documentElement.style.setProperty("--panel",safeColor(t.panel,"#ffffff"));
  document.documentElement.style.setProperty("--text",safeColor(t.text,"#45383d"));
  const title=(a.title||data?.artist_name||"公开排单").trim();
  $("brandTitle").textContent=title+" · 公开排单";
  document.title=title+" · 公开排单";
  const img=[a.avatar,a.app_icon].find(x=>String(x||"").startsWith("data:image/"))||"";
  if(img){
    $("brandImage").src=img;
    $("brandImage").style.display="block";
    $("brandEmoji").style.display="none";
  }else{
    $("brandImage").removeAttribute("src");
    $("brandImage").style.display="none";
    $("brandEmoji").style.display="";
  }
}
function fmtDateTime(v){
  if(!v)return "暂无更新时间";
  const d=new Date(v);
  if(Number.isNaN(d.getTime()))return "暂无更新时间";
  return new Intl.DateTimeFormat("zh-CN",{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}).format(d);
}
function render(data){
  applyAppearance(data);
  if(!data?.found){
    $("artistName").textContent="这个公开排单链接不存在";
    $("updatedText").textContent="请向美工确认链接是否正确。";
    $("privacyBadge").textContent="无效链接";
    $("scheduleList").innerHTML='<div class="empty">没有找到对应的公开排单。</div>';
    return;
  }
  $("artistName").textContent=data.artist_name||"莓桃美工";
  $("updatedText").textContent="最后更新时间："+fmtDateTime(data.updated_at);
  $("privacyBadge").textContent=data.privacy_mode==="private"?"🔒 隐私排单":"🌷 公开排单";
  if(!data.enabled){
    $("scheduleList").innerHTML='<div class="empty">该美工当前未开放公开排单。<br>重新开启后仍会使用这一条固定链接。</div>';
    return;
  }
  const orders=Array.isArray(data.orders)?data.orders:[];
  if(!orders.length){
    $("scheduleList").innerHTML='<div class="empty">当前没有进行中的排单 🌷</div>';
    return;
  }
  $("scheduleList").innerHTML=orders.map((o,i)=>{
    const due=[o.due_date,o.due_time].filter(Boolean).join(" ");
    const range=[o.start_date,due].filter(Boolean).join(" → ");
    const pct=Math.max(0,Math.min(100,Number(o.progress)||0));
    return '<article class="item"><div class="row"><div><div class="pos">排队 '+(i+1)+'</div><div class="title">'+esc(o.name||"未命名需求")+'</div></div><span class="status">'+esc(o.status||"待处理")+'</span></div>'+(o.customer_nickname?'<div class="meta">顾客：'+esc(o.customer_nickname)+'</div>':'')+(o.category?'<div class="meta">分类：'+esc(o.category)+'</div>':'')+(range?'<div class="meta">时间：'+esc(range)+'</div>':'')+'<div class="meta">进度：'+pct+'%</div><div class="progress"><span style="width:'+pct+'%"></span></div></article>';
  }).join("");
}
async function load(){
  if(!token){render({found:false});return}
  const {data,error}=await supabase.rpc("get_public_artist_schedule",{p_token:token});
  if(error){
    console.error(error);
    $("artistName").textContent="公开排单暂时无法读取";
    $("updatedText").textContent="请稍后刷新。";
    $("privacyBadge").textContent="读取失败";
    $("scheduleList").innerHTML='<div class="empty">公开排单数据库还没有完成升级，或网络暂时不可用。</div>';
    return;
  }
  render(data);
}
load();
setInterval(load,30000);
</script>
</body>
</html>
